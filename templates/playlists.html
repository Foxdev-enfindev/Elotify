<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elotify - Choisir une Playlist</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
</head>
<body>

    <!-- --- BLOC PROFIL & MENU DÉROULANT --- -->
    {% if user %}
    <div class="user-profile-container" id="profileMenuContainer">
        <div class="profile-trigger" onclick="toggleDropdown(event)">
            {% if user.image %}
                <img src="{{ user.image }}" alt="Avatar" class="user-avatar">
            {% else %}
                <div class="user-avatar-placeholder">👤</div>
            {% endif %}
            <span class="user-name">{{ user.display_name }}</span>
            <span class="arrow-down">▼</span>
        </div>
        <div class="profile-dropdown" id="profileDropdown">
            <a href="{{ url_for('logout') }}" class="logout-link">🚪 Déconnexion</a>
        </div>
    </div>
    {% endif %}

    <div class="container">
        <h1>🎵 SÉLECTIONNEZ UNE PLAYLIST 🎵</h1>
        
        <div class="playlist-grid">
            {% for pl in playlists %}
            <a href="{{ url_for('select_playlist', playlist_id=pl.id) }}" class="playlist-card">
                
                {% if pl.images %}
                    <img src="{{ pl.images[0].url }}" class="playlist-img" alt="Couverture {{ pl.name }}">
                {% else %}
                    <div class="playlist-img playlist-img-placeholder">🎶</div>
                {% endif %}
                
                <div class="playlist-title">{{ pl.name }}</div>
                <div class="playlist-count">{{ pl.total_tracks }} titres</div>
            </a>
            {% endfor %}
        </div>
    </div>

    <script>
        function toggleDropdown(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('profileDropdown');
            if (dropdown) dropdown.classList.toggle('show');
        }

        window.onclick = function(event) {
            const dropdown = document.getElementById('profileDropdown');
            if (dropdown && dropdown.classList.contains('show')) {
                dropdown.classList.remove('show');
            }
        }
    </script>
</body>
</html>
