<!DOCTYPE html>
<html lang="fr" data-bg-mode="dark" data-theme="green">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Playlists - Elotify</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>
<body class="playlists-body">

    {% include 'includes/user_menu.html' %}

    <div class="playlists-container">
        <div class="playlists-header">
            <h1>🎵 CHOISIS UNE PLAYLIST 🎵</h1>
            <a href="{{ url_for('index') }}" class="back-btn">⚔️ Retour aux duels</a>
        </div>

        <div class="playlists-grid">
            {% for playlist in playlists %}
            <a href="{{ url_for('select_playlist', playlist_id=playlist.id) }}" class="playlist-card">
                {% if playlist.image_url %}
                    <img src="{{ playlist.image_url }}" alt="{{ playlist.name }}" class="playlist-img">
                {% else %}
                    <div class="playlist-img-placeholder">🎵</div>
                {% endif %}
                <div class="playlist-info">
                    <span class="playlist-name">{{ playlist.name }}</span>
                    <span class="playlist-tracks">{{ playlist.tracks_count }} titres</span>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>
</body>
</html>
