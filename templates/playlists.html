<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elotify - Vos Playlists</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <h1>Mes Playlists</h1>
        <p>Sélectionnez une playlist pour lancer les duels</p>
    </header>

    <div class="playlists-grid">
        {% for pl in playlists %}
            <a href="{{ url_for('select_playlist', playlist_id=pl.id) }}" class="playlist-card">
                {% if pl.images %}
                    <img src="{{ pl.images[0].url }}" alt="{{ pl.name }}" class="playlist-img">
                {% else %}
                    <div class="playlist-img" style="background:#282828; display:flex; align-items:center; justify-content:center; color:#888;">🎵</div>
                {% endif %}
                
                <div class="playlist-info">
                    <p class="playlist-title">{{ pl.name }}</p>
                    <span class="playlist-count">{{ pl.total_tracks }} titres</span>
                </div>
            </a>
        {% endfor %}
    </div>

    <div class="nav-links">
        <a href="{{ url_for('index') }}" class="btn-nav">⚔️ Retour au Match</a>
        <a href="{{ url_for('logout') }}" class="btn-nav" style="color: #ff5555;">Déconnexion</a>
    </div>

</body>
</html>
