<!DOCTYPE html>
<html lang="fr" data-bg-mode="dark" data-theme="green">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classement Général - Elotify</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>
<body class="classement-body">

    {% include 'includes/user_menu.html' %}

    <div class="classement-container">
        <div class="classement-header">
            <h1>🏆 CLASSEMENT COMPLET 🏆</h1>
            <a href="{{ url_for('index') }}" class="back-btn">⚔️ Retour aux duels</a>
        </div>

        <div class="ranking-list">
            {% for track in ranking %}
            <div class="ranking-card">
                <span class="ranking-rank">#{{ loop.index }}</span>
                {% if track.image_url %}
                    <img src="{{ track.image_url }}" alt="{{ track.name }}" class="ranking-img">
                {% endif %}
                <div class="ranking-info">
                    <span class="ranking-name">{{ track.name }}</span>
                    <span class="ranking-artist">{{ track.artist }}</span>
                </div>
                <span class="ranking-elo">{{ track.elo }} pts</span>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
