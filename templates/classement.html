<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elotify - Classement</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <h1>Classement Elo</h1>
        <p>Les meilleurs morceaux de votre playlist</p>
    </header>

    <div class="table-container">
        <table class="ranking-table">
            <thead>
                <tr>
                    <th style="width: 30px;">#</th>
                    <th style="width: 50px;"></th>
                    <th>Titre</th>
                    <th style="text-align: right;">Elo</th>
                </tr>
            </thead>
            <tbody>
                {% for track in tracks %}
                    <tr class="{% if loop.index == 1 %}top-1{% elif loop.index == 2 %}top-2{% elif loop.index == 3 %}top-3{% endif %}">
                        <td class="rank-number">{{ loop.index }}</td>
                        <td>
                            {% if track.image_url %}
                                <img src="{{ track.image_url }}" alt="{{ track.name }}" class="ranking-img">
                            {% else %}
                                <div class="ranking-img" style="background:#282828; display:flex; align-items:center; justify-content:center;">🎵</div>
                            {% endif %}
                        </td>
                        <td>
                            <div class="ranking-details">
                                <span class="ranking-title">{{ track.name }}</span>
                                <span class="ranking-artist">{{ track.artist }}</span>
                            </div>
                        </td>
                        <td class="ranking-elo">{{ track.elo }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="nav-links">
        <a href="{{ url_for('index') }}" class="btn-nav">⚔️ Continuer à voter</a>
        <a href="{{ url_for('liste_playlists') }}" class="btn-nav">📋 Playlists</a>
    </div>

</body>
</html>
