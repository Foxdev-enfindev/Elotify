<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session terminée - Elotify Duel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="quit-body">
    <div class="quit-container">
        <h1 class="quit-title">Session terminée</h1>
        
        <p class="quit-subtitle">
            Voici le top 5 de ta playlist <strong>« {{ playlist_name }} »</strong> :
        </p>

        <div class="top5-list">
            {% for track in top5 %}
                <div class="top5-item">
                    <span class="top5-rank">#{{ loop.index }}</span>
                    {% if track.image_url %}
                        <img src="{{ track.image_url }}" alt="Pochette" class="top5-img">
                    {% endif %}
                    <div class="top5-info">
                        <span class="top5-track-title">{{ track.name }}</span>
                        <span class="top5-track-artist">{{ track.artist }}</span>
                    </div>
                    <span class="top5-elo">{{ track.elo }} Elo</span>
                </div>
            {% endfor %}
        </div>

        <p class="close-notice">Tu peux maintenant fermer la page.</p>
    </div>
</body>
</html>
